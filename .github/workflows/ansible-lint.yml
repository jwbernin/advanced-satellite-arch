name: Run ansible-lint
on: push
#  pull_request:
#    branches: ["main", "stable", "release/v*"]
jobs:
  ansible-lint:
    runs-on: ansible/ansible@main
    env:
      ANSIBLE_GALAXY_SERVER_LIST: certified,validated,galaxy
      ANSIBLE_GALAXY_SERVER_CERTIFIED_URL: https://console.redhat.com/api/automation-hub/content/published/
      ANSIBLE_GALAXY_SERVER_CERTIFIED_AUTH_URL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
      ANSIBLE_GALAXY_SERVER_CERTIFIED_TOKEN: ${{ secrets.AUTOMATION_HUB_TOKEN }}
      ANSIBLE_GALAXY_SERVER_VALIDATED_URL: https://console.redhat.com/api/automation-hub/content/validated/
      ANSIBLE_GALAXY_SERVER_VALIDATED_AUTH_URL: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
      ANSIBLE_GALAXY_SERVER_VALIDATED_TOKEN: ${{ secrets.AUTOMATION_HUB_TOKEN }}
      ANSIBLE_GALAXY_SERVER_GALAXY_URL: https://galaxy.ansible.com/api/
