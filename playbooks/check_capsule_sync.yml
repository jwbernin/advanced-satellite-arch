---
- name: Get the status of a capsule sync on Satellite
  hosts: all
  gather_facts: true
  become: true
  serial: 1 # Ensures that content finishes syncing on the connected satellite before syncing begins on the disconnected satellites
  order: sorted # Alphabetically - Connected satellite should be first in the inventory

  tasks:
    - name: Include check capsule sync task from the role
      ansible.builtin.include_role:
        name: satellite_operations
        tasks_from: check_capsule_sync.yml
...
