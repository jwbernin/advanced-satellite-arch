---
# Publish Content View
- name: Publish | Create Content View
  block:
    # Publish an unfiltered content view revision, with the content_view_version_number of YYYYMMDD.0
    - name: Publish | Publish content view {{ cv['name']}} as version {{ content_view_version_number }}
      redhat.satellite.content_view_version:
        username: "{{ satellite_username | mandatory }}"
        password: "{{ satellite_password | mandatory }}"
        server_url: "https://{{ satellite_server_url }}"
        validate_certs: "{{ satellite_validate_certs | default(omit, true) }}"
        organization: "{{ satellite_organization }}"
        lifecycle_environments: "{{ content_view_lifecycle_environments_default | default('Library') }}"
        content_view: "{{ cv['name'] }}"
        description: "{{ content_view_publish_description | default(omit, true) }}"
        version: "{{ content_view_version_number | default(omit, true) }}"
        force_promote: "{{ content_view_promote | default(false) }}"
        state: present
      async: "{{ satellite_operation_timeout }}"
      poll: "{{ satellite_poll_interval }}"
      register: publish_result


