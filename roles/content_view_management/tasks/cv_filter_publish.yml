---
- name: Publish Filtered | Create Content View
  block:

    # Create Content View Filter for Erratum
    - name: Publish Filtered | Create errata content view filter - {{ content_view_package_filter_end_date }}
      redhat.satellite.content_view_filter:
        username: "{{ satellite_username | mandatory }}"
        password: "{{ satellite_password | mandatory }}"
        server_url: "https://{{ satellite_server_url }}"
        validate_certs: "{{ satellite_validate_certs | default(omit, true) }}"
        organization: "{{ satellite_organization | mandatory }}"
        content_view: "{{ cv['name'] }}"
        name: "{{ content_view_filter_name_by_date | mandatory }}"
        description: "{{ content_view_filter_description | mandatory }}"
        filter_type: "{{ content_view_filter_type_erratum }}" # Filter type set to erratum by date
        inclusion: "{{ content_view_inclusion }}"  # This makes it an include filter
        state: present
      register: filter_result
      failed_when:
        - filter_result['failed']
        - "'already exists' not in filter_result['msg']"

    # Create Content View Filter for Erratum, include errate by the defined end_date
    - name: Publish | Create filter rule to include packages on or before {{ content_view_package_filter_end_date }}
      redhat.satellite.content_view_filter_rule:
        username: "{{ satellite_username | mandatory }}"
        password: "{{ satellite_password | mandatory }}"
        server_url: "https://{{ satellite_server_url }}"
        validate_certs: "{{ satellite_validate_certs | default(omit, true) }}"
        organization: "{{ satellite_organization | mandatory }}"
        content_view: "{{ cv['name'] }}"
        content_view_filter: "{{ content_view_filter_name_by_date | mandatory }}" # Filter type set to erratum by date
        state: present
        date_type: "{{ content_view_date_type | default('updated') }}" # issued or updated, default to updated
        types: "{{ content_view_erratum_type }}"
        end_date: "{{ content_view_package_filter_end_date | mandatory }}" # Variable must be set in order to set filter by end date
      register: filter_rule_result
      failed_when: false

    # - name: Print Filter Rule output
    #   ansible.builtin.debug:
    #     var: filter_rule_result

    # - name: Debug
    #   ansible.builtin.debug:
    #     var: repo | selectattr('name', 'defined') | map(attribute='name')
    #   when:
    #     - content_view_specific_packages | length > 0
    #     - repo | length > 0
    #   loop: "{{ content_view_specific_packages | map(attribute='repositories', default=[]) }}"
    #   loop_control:
    #     loop_var: repo
    #   register: filter_result

    # Create Content View Filter for RPM, if content_view_specific_packages is defined
    - name: Publish Filtered | Create RPM content view filter for specific repositories
      redhat.satellite.content_view_filter:
        username: "{{ satellite_username | mandatory }}"
        password: "{{ satellite_password | mandatory }}"
        server_url: "https://{{ satellite_server_url }}"
        validate_certs: "{{ satellite_validate_certs | default(omit, true) }}"
        organization: "{{ satellite_organization | mandatory }}"
        content_view: "{{ cv['name'] }}"
        repositories: "{{ repo }}"
        name: "{{ content_view_filter_rule_name_rpm_specific }} - {{ repo | selectattr('name', 'defined') | map(attribute='name') | first }}"
        description: "{{ content_view_filter_description | mandatory }}"
        filter_type: "{{ content_view_filter_type_rpm }}"
        original_packages: "{{ content_view_original_packages }}"
        inclusion: "{{ content_view_inclusion }}" # This makes it an include filter
        state: present
      when:
        - content_view_specific_packages | length > 0 # This checks content_view_specific_packages list has content, skip if empty
        - repo | length > 0 # This checks content_view_specific_packages, repositories, verifies repositories is greater than 0, skip if == 0
      loop: "{{ content_view_specific_packages | map(attribute='repositories', default=[]) }}" # Loop through repositories from content_view_specific_packages variable
      loop_control:
        loop_var: repo
      register: filter_result

    # Create Content View Filter for RPM, if content_view_specific_packages repositories is an empty list
    - name: Publish Filtered | Create RPM content view filter for all repositories
      redhat.satellite.content_view_filter:
        username: "{{ satellite_username | mandatory }}"
        password: "{{ satellite_password | mandatory }}"
        server_url: "https://{{ satellite_server_url }}"
        validate_certs: "{{ satellite_validate_certs | default(omit, true) }}"
        organization: "{{ satellite_organization | mandatory }}"
        content_view: "{{ cv['name'] }}"
        name: "{{ content_view_filter_rule_name_all_repositories }}"
        description: "{{ content_view_filter_description | mandatory }}"
        filter_type: "{{ content_view_filter_type_rpm }}"
        original_packages: "{{ content_view_original_packages }}"
        inclusion: "{{ content_view_inclusion }}"  # This makes it an include filter
        state: present
      when:
        - content_view_specific_packages | length > 0
        - repo | length == 0
      loop: "{{ content_view_specific_packages | map(attribute='repositories', default=[]) }}" # Loop through repositories from content_view_specific_packages variable
      loop_control:
        loop_var: repo
      register: filter_result

    # Create Content View Filter for RPM, if add packages that are to be added to specific repositories
    - name: Publish Filtered  | Add RPMs to content view filter for specific repositories if provided
      redhat.satellite.content_view_filter_rule:
        username: "{{ satellite_username | mandatory }}"
        password: "{{ satellite_password | mandatory }}"
        server_url: "https://{{ satellite_server_url }}"
        validate_certs: "{{ satellite_validate_certs | default(omit, true) }}"
        organization: "{{ satellite_organization }}"
        content_view: "{{ cv['name'] }}"
        content_view_filter: "{{ content_view_filter_rule_name_rpm_specific }} - {{ package['repositories'] | selectattr('name', 'defined') | map(attribute='name') | first }}"
        date_type: "{{ content_view_date_type | default('updated') }}" # issued or updated, default to updated
        name: "{{ package['name'] }}"
        version: "{{ package['version'] | default(omit, true) }}"
        state: present
      when:
        - content_view_specific_packages | length > 0 # This checks content_view_specific_packages list has content, skip if empty
        - package['repositories'] | default([]) | length > 0 # This checks content_view_specific_packages, repositories, verifies repositories is greater than 0, skip if == 0
      loop: "{{ content_view_specific_packages }}"
      loop_control:
        loop_var: package
      register: package_rule_result

    # Create Content View Filter for RPM, if add packages that are to be added to all repositories
    - name: Publish Filtered  | Add RPMs to content view filter for specific repositories if provided - all repositories
      redhat.satellite.content_view_filter_rule:
        username: "{{ satellite_username | mandatory }}"
        password: "{{ satellite_password | mandatory }}"
        server_url: "https://{{ satellite_server_url }}"
        validate_certs: "{{ satellite_validate_certs | default(omit, true) }}"
        organization: "{{ satellite_organization }}"
        content_view: "{{ cv['name'] }}"
        content_view_filter: "{{ content_view_filter_rule_name_all_repositories }}"
        date_type: "{{ content_view_date_type | default('updated') }}" # issued or updated, default to updated
        name: "{{ package['name'] }}"
        version: "{{ package['version'] | default(omit, true) }}"
        state: present
      when:
        - content_view_specific_packages | length > 0 # This checks content_view_specific_packages list has content, skip if empty
        - package['repositories'] | length == 0 # This checks content_view_specific_packages, package, verifies repositories is empty
      loop: "{{ content_view_specific_packages }}"
      loop_control:
        loop_var: package
      register: package_rule_result

    # Publish an filtered content view revision, with the content_view_version_number of YYYYMMDD.1
    - name: Publish | Publish content view {{ cv['name']}} as version {{ content_view_version_number }}.{{ content_view_version_minor_rel_number }}
      redhat.satellite.content_view_version:
        username: "{{ satellite_username | mandatory }}"
        password: "{{ satellite_password | mandatory }}"
        server_url: "https://{{ satellite_server_url }}"
        validate_certs: "{{ satellite_validate_certs | default(omit, true) }}"
        organization: "{{ satellite_organization }}"
        lifecycle_environments: "{{ content_view_lifecycle_environments | default([]) }}" # if content_view_lifecycle_environments is undefined, set to empty list
        content_view: "{{ cv['name'] }}"
        description: "{{ content_view_publish_description | default(omit, true) }}"
        version: "{{ content_view_version_number | default(omit, true) }}.{{ content_view_version_minor_rel_number }}" # Add a .1 to the version number
        force_promote: "{{ content_view_filtered_promote | default(false) }}"
        state: present
      async: "{{ satellite_operation_timeout }}"
      poll: "{{ satellite_poll_interval }}"
      register: publish_result

