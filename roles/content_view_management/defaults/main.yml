---
# Satellite Settings
satellite_server_url: "satellite.fqdn" # string
satellite_username: "admin" # Username for Red Hat Satellite Administration
satellite_password: "changeme" # Best Practice: Store satellite_password in a vault
satellite_organization: "Default Organization"

# Optional Variables with defaults
satellite_validate_certs: false    # boolean
satellite_operation_timeout: 7200  # 2 hours in seconds, integer
satellite_poll_interval: 30        # 30 seconds, integer

# Content View Settings
content_view_name: satellite6 # string
content_view_version_number: "{{ ansible_date_time['date'] | split('-') | join('') }}" # Must be string, not integer
content_view_version_minor_rel_number: "1" # Must be string, not integer
content_view_lifecycle_environments: [] # Empty list 
content_view_lifecycle_environments_default: 
  - Library
content_view_repositories: [] # Empty list will include all repositories in filter
content_view_original_packages: true  # boolean, to include all RPMs with no errata
content_view_inclusion: true  # boolean, create an include filter; false is exclude filter
content_view_promote: true # this is the Library content
content_view_filtered_promote: false
content_view_date_type: updated # issued or updated
content_view_filter_type_rpm: rpm # rpm, package_group, erratum, docker, modulemd, deb
content_view_filter_type_erratum: erratum # rpm, package_group, erratum, docker, modulemd, deb
content_view_erratum_type: # Erratum types are bugfix, security, enhancement - by default module applies all 3.
  - bugfix
  - security
  - enhancement
content_view_filter_name_by_date: "Filter by date - {{ content_view_package_filter_end_date }}"
content_view_filter_rule_name_rpm_specific: "RPM Filtered"
content_view_filter_rule_name_all_repositories: "{{ content_view_filter_rule_name_rpm_specific }} - All Repositories" 
content_view_filter_description: "Published via AAP {{ ansible_date_time['date'] }} at {{ ansible_date_time['time'] }}" # This should better defined
content_view_publish_description: "Published via AAP {{ ansible_date_time['date'] }} at {{ ansible_date_time['time'] }}" # This should better defined
content_view_package_filter_end_date: "{{ ansible_date_time['date'] }}" # YYYY-MM-DD - Specify a date, by default will occur on date of execution

# content_view_specific_packages is a list, entries must be added in list format. Remove brackets when adding items to list
# Example
# content_view_specific_packages:
#   - name: kernel
#     version: 5.14.0
#     repositories:
#       - name: "Red Hat Enterprise Linux 9 for x86_64 - BaseOS RPMs 9"
#         product: "Red Hat Enterprise Linux for x86_64"
#   - name: vim-common
#     repositories:
#       - name: "Red Hat Enterprise Linux 9 for x86_64 - AppStream RPMs 9"
#         product: "Red Hat Enterprise Linux for x86_64"
#   - name: terminator
#     repositories: []
content_view_specific_packages: []
