---
# Check if import lock file exists
- name: Import Content View | Check if another import is running via lock file
  ansible.builtin.stat:
    path: "{{ satellite_import_lock_file }}"
  register: satellite_import_lock_status

# Run shell command to check if Satellite imports are actively running
- name: Import Content View | Verify there are no hammer content_import jobs running
  ansible.builtin.shell: hammer task list --fields id,action,state --search="state = running" | grep -i import | wc -l
  register: hammer_job_results
  become: true # must be root to execute this task
  changed_when: false

# Validate no other import jobs are running
- name: Import Content View | Fail if another import is running
  ansible.builtin.assert:
    that:
      - not satellite_import_lock_status['stat']['exists']
      - hammer_job_results['stdout'] != "0" # output for import
    fail_msg: >
      Another import process is running.
      Manually verify no imports are running (currently {{ hammer_job_results['stdout'] }} jobs are running).
      Validate {{ satellite_import_lock_file }} is removed before trying again.
    success_msg: "There are currently no other imports running at this time."
  when: satellite_import_lock_status['stat']['exists']

# Create new lock file
- name: Import Content View | Create lock file
  ansible.builtin.file:
    path: "{{ satellite_import_lock_file }}"
    state: touch
    mode: '0644'
  when: not satellite_import_lock_status['stat']['exists']

# Check disk space availability
- name: Import Content View | Check available disk space
  ansible.builtin.assert:
    that:
      - not (ansible_mounts | selectattr("mount", "equalto", satellite_directories) | list) | map(attribute='size_available') | first < satellite_required_space_gb | human_to_bytes(default_unit="G")
    fail_msg: "Please make sure there is enough available space before executing an import."
    quiet: true

# Import Content View - Version when satellite_import_content_view_version is set to true
- name: Import Content - Version | Import content version - {{ satellite_import_content_view_name }}-{{ satellite_import_content_view_version }}
  become: true
  when:
    - satellite_import_content_view_version
  block:
    # Import Content View Version
    - name: Import content version - {{ satellite_import_content_view_name }}-{{ satellite_import_content_view_version_number }} | Import content view from /var/lib/pulp/imports directory
      redhat.satellite.content_import_version:
        username: "{{ satellite_username | mandatory }}"
        password: "{{ satellite_password | mandatory }}"
        server_url: "https://{{ satellite_server_url }}"
        validate_certs: "{{ satellite_validate_certs | default(omit, true) }}"
        organization: "{{ satellite_organization }}"
        path: "{{ satellite_import_path | mandatory }}"
        metadata_file: "{{ satellite_import_content_view_metadata_file | default(omit, true) }}"
      async: "{{ satellite_import_wait_time | int }}"
      poll: 30

  rescue:
    # Import failed message
    - name: Import content version - {{ satellite_import_content_view_name }}-{{ satellite_import_content_view_version_number }} | Handle import failure
      ansible.builtin.debug:
        msg: "Satellite import of content view failed"

# Remove old imports - STILL WIP
- name: Import Content View | Cleanup old imports
  when:
    - satellite_cleanup_old_imports
  become: true
  block:
    - name: Cleanup old imports | Find old imports
      ansible.builtin.find:
        paths: "/var/lib/pulp/imports"
        file_type: file
        patterns: "import-*"
        age: "{{ satellite_cleanup_old_import_age }}"
      register: old_imports

    - name: Cleanup old imports | Remove old imports
      ansible.builtin.file:
        path: "{{ file['path'] }}"
        state: absent
      loop: "{{ old_imports['files'] }}"
      loop_control:
        loop_var: file
        label: "{{ file }}"

  rescue:
    - name: Cleanup old imports | Log cleanup failure
      ansible.builtin.debug:
        msg: "Failed to cleanup old imports"

    # Add a fail task here?

# Remove Lock File when completed
- name: Import Content - Version | Remove lock file
  ansible.builtin.file:
    path: "{{ satellite_import_lock_file }}"
    state: absent
...
